<!DOCTYPE html> 
<html>
<head>
<title>Login - FoodExpress</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

/* 🔥 New Background */
body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:linear-gradient(135deg, #b31217, #e52d27);
}

/* Glass effect box */
.form-box{
    background:rgba(255,255,255,0.95);
    padding:35px;
    border-radius:20px;
    width:340px;
    text-align:center;
    box-shadow:0 15px 40px rgba(0,0,0,0.4);
    backdrop-filter: blur(10px);
}

/* Logo */
.logo{
    width:130px;
    height:130px;
    object-fit:cover;
    border-radius:50%;
    margin-bottom:15px;
    box-shadow:0 8px 20px rgba(0,0,0,0.3);
}

/* ✅ Added Title Style (Nothing else changed) */
.brand-title{
    font-size:22px;
    font-weight:bold;
    color:#b31217;
    margin-bottom:5px;
}

.brand-subtitle{
    font-size:13px;
    color:#666;
    margin-bottom:20px;
}

/* Inputs */
input{
    width:100%;
    padding:12px;
    margin:12px 0;
    border-radius:8px;
    border:1px solid #ddd;
    font-size:14px;
}

/* Button */
button{
    width:100%;
    padding:12px;
    background:linear-gradient(45deg,#ff4d4d,#ff1a1a);
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
    font-size:15px;
    transition:0.3s;
}

button:hover{
    transform:scale(1.05);
}

/* Link */
a{
    display:block;
    margin-top:15px;
    text-decoration:none;
    color:#b31217;
    font-weight:bold;
}
</style>

</head>
<body>

<div class="form-box">

<img src="logo.webp" alt="FoodExpress Logo" class="logo">

<!-- ✅ Added Title Below Logo -->
<div class="brand-title">FoodExpress</div>
<div class="brand-subtitle">Delicious Food Delivered To Your Doorstep</div>

<h2></h2>

<form action="index.html">
<input type="email" placeholder="Email" required>

<input type="password" placeholder="Password" required>

<button type="submit">Login</button>

</form>

<a href="signup.html">Don't have an account? Sign Up</a>

</div>

</body>
</html>
