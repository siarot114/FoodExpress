<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Summary - FoodExpress</title>

<style>
body{
    font-family: Arial, sans-serif;
    margin:0;
    padding:0;
    text-align:center;
    background: linear-gradient(135deg, #8b0000, #b31217);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.summary-box{
    background:white;
    width:500px;
    padding:30px;
    border-radius:15px;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-bottom:20px;
}

th, td{
    padding:10px;
    text-align:center;
    border:1px solid #ddd;
}

th{
    background:#ff4d4d;
    color:white;
}

/* Button style */
.btn{
    padding:12px 25px;
    background:#ff4d4d;
    color:white;
    border-radius:8px;
    text-decoration:none;
    font-weight:bold;
    font-size:15px;
    transition:0.3s;
}

.btn:hover{
    background:#e60000;
}

/* FLEX CONTAINER FOR BUTTONS */
.button-group{
    display:flex;
    justify-content:center;
    gap:15px; /* space between buttons */
}

@media(max-width:600px){
    .summary-box{
        width:90%;
        padding:20px;
    }

    /* Stack buttons on small screens */
    .button-group{
        flex-direction:column;
    }
}
</style>
</head>

<body>

<div class="summary-box">
<h1>Order Summary</h1>

<p><strong>Estimated Delivery Time:</strong> 30–45 minutes</p>

<table>
<tr>
<th>Dish</th>
<th>Quantity</th>
<th>Price (₱)</th>
<th>Total (₱)</th>
</tr>

<tr>
<td>Cheese Burger</td>
<td>2</td>
<td>120</td>
<td>240</td>
</tr>

<tr>
<td>Pepperoni Pizza</td>
<td>1</td>
<td>200</td>
<td>200</td>
</tr>

<tr>
<td>Iced Coffee</td>
<td>1</td>
<td>100</td>
<td>100</td>
</tr>

<tr>
<th colspan="3">Grand Total</th>
<th>540</th>
</tr>
</table>

<!-- BUTTONS SIDE BY SIDE -->
<div class="button-group">
    <a href="checkout.html" class="btn">Back</a>
    <a href="order-confirm.html" class="btn">Confirm Order</a>
</div>

</div>

</body>
</html>
