<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log Out - FoodExpress</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}
html{
    scroll-behavior:smooth;
}

/* Dark red gradient background */
body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background: linear-gradient(135deg,#b31217,#e52d27);
}

/* Main wrapper to center content */
main{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

/* Logout Container */
.logout-container{
    max-width:600px;
    background:white;
    padding:40px;
    border-radius:12px;
    box-shadow:0 10px 20px rgba(0,0,0,0.2);
    text-align:center;
}

.logout-container h2{
    color:#b31217;
    margin-bottom:20px;
    border-bottom:3px solid #b31217;
    display:inline-block;
    padding-bottom:5px;
}

.logout-container p{
    font-size:18px;
    margin-bottom:25px;
    color:#333;
}

/* Button */
button{
    padding:12px 20px;
    background: linear-gradient(45deg,#ff4d4d,#ff1a1a);
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
    font-size:16px;
    transition:0.3s;
}

button:hover{
    transform:scale(1.05);
}

/* Footer */
footer{
    background:#333;
    color:white;
    text-align:center;
    padding:15px;
}

</style>
</head>

<body>

<main>
<div class="logout-container">
<h2>Logged Out</h2>
<p>You have successfully logged out of your FoodExpress account.</p>

<form action="login.html">
<button type="submit">Go to Login Page</button>
</form>

</div>
</main>

<footer>
<p>&copy; 2026 FoodExpress | All Rights Reserved</p>
</footer>

</body>
</html>
