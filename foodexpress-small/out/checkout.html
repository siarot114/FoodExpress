<!DOCTYPE html>
<html>
<head>
<title>Checkout - FoodExpress</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

/* Same background theme */
body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:linear-gradient(135deg, #b31217, #e52d27);
}

/* Glass card */
.checkout-box{
    background:rgba(255,255,255,0.95);
    padding:35px;
    border-radius:20px;
    width:400px;
    text-align:center;
    box-shadow:0 15px 40px rgba(0,0,0,0.4);
    backdrop-filter: blur(10px);
}

/* Logo */
.logo{
    width:110px;
    height:110px;
    object-fit:cover;
    border-radius:50%;
    margin-bottom:15px;
    box-shadow:0 8px 20px rgba(0,0,0,0.3);
}

/* Brand */
.brand-title{
    font-size:22px;
    font-weight:bold;
    color:#b31217;
}

.brand-subtitle{
    font-size:13px;
    color:#666;
    margin-bottom:20px;
}

/* Inputs */
input, select{
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:8px;
    border:1px solid #ddd;
    font-size:14px;
}

/* Button */
button{
    width:100%;
    padding:12px;
    margin-top:15px;
    background:linear-gradient(45deg,#ff4d4d,#ff1a1a);
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
    font-size:15px;
    transition:0.3s;
}

button:hover{
    transform:scale(1.05);
}

a{
    display:block;
    margin-top:15px;
    text-decoration:none;
    color:#b31217;
    font-weight:bold;
}
</style>

</head>
<body>

<div class="checkout-box">

<img src="logo.webp" alt="FoodExpress Logo" class="logo">

<div class="brand-title">FoodExpress</div>
<div class="brand-subtitle">Checkout</div>

<h2>Delivery Details</h2>

<form action="order-summary.html">

<input type="text" placeholder="Full Name" required>
<input type="text" placeholder="Delivery Address" required>
<input type="tel" placeholder="Phone Number" required>

<select required>
<option value="">Select Payment Method</option>
<option>Cash on Delivery</option>
<option>GCash</option>
<option>Credit / Debit Card</option>
</select>

<button type="submit">View Order</button>

</form>

<a href="menu.html">Back to Menu</a>

</div>

</body>
</html>
