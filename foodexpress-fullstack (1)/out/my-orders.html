<!DOCTYPE html> 
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Orders - FoodExpress</title>

<style>
body{
    font-family:Arial;
    background:#b31217;
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
}
.status{
    background:#fff3cd;
    color:#856404;
    padding:5px 10px;
    border-radius:12px;
    font-size:13px;
}
.confirm-box{
    background:white;
    width:500px;
    padding:30px;
    border-radius:15px;
}

h1{
    color:#ff4d4d;
    margin-bottom:10px;
}

.info{
    font-size:16px;
    margin:5px 0;
}

/* RECEIPT TABLE */
table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th, td{
    padding:10px;
    border:1px solid #ddd;
}

th{
    background:#ff4d4d;
    color:white;
}

/* ONLY COLOR GRAND TOTAL LABEL */
.total-row{
    font-weight:bold;
}

.total-row td:first-child{
    background:#ff4d4d;
    color:white;
}

/* BUTTON */
a{
    display:inline-block;
    padding:12px 25px;
    margin-top:20px;
    background:#ff4d4d;
    color:white;
    text-decoration:none;
    border-radius:8px;
    font-weight:bold;
    transition:0.3s;
}

a:hover{
    background:#e60000;
}

/* Responsive */
@media(max-width:600px){
    .confirm-box{
        width:90%;
        padding:20px;
    }
}
.msg{color:#b31217;font-size:13px;min-height:18px;margin-top:6px}.msg.ok{color:#1a7f37}.status.cancelled{background:#f8d7da;color:#842029}.status.preparing{background:#fff3cd;color:#856404}
#cancel{background:#555;margin-left:10px}
.confirm-box{width:560px;text-align:left}h1{text-align:center}
.order{border:1px solid #ddd;border-radius:12px;padding:14px 16px;margin:14px 0}
.order-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.items{margin:8px 0;color:#444}.order-foot{display:flex;justify-content:space-between;align-items:center;font-weight:bold}
.small-link{margin:0;padding:6px 16px;font-size:14px}.center{text-align:center}
[hidden]{display:none!important}
</style>

</head>
<body data-page="orders" data-requires-login>
<div class="confirm-box">
<h1>My Orders</h1>
<p class="msg center" id="msg" role="status" aria-live="polite">Loading your orders…</p>
<div id="list"></div>
<div class="center">
<a href="menu.html" id="none" hidden>Order something tasty</a>
<a href="index.html" style="margin-left:10px;background:#555">Back to Home</a>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="supabase-config.js"></script>
<script src="app.js"></script>
</body>
</html>
