<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Summary - FoodExpress</title>

<style>
body{
    font-family: Arial, sans-serif;
    margin:0;
    padding:0;
    text-align:center;
    background: linear-gradient(135deg, #8b0000, #b31217);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.summary-box{
    background:white;
    width:500px;
    padding:30px;
    border-radius:15px;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-bottom:20px;
}

th, td{
    padding:10px;
    text-align:center;
    border:1px solid #ddd;
}

th{
    background:#ff4d4d;
    color:white;
}

/* Button style */
.btn{
    padding:12px 25px;
    background:#ff4d4d;
    color:white;
    border-radius:8px;
    text-decoration:none;
    font-weight:bold;
    font-size:15px;
    transition:0.3s;
}

.btn:hover{
    background:#e60000;
}

/* FLEX CONTAINER FOR BUTTONS */
.button-group{
    display:flex;
    justify-content:center;
    gap:15px; /* space between buttons */
}

@media(max-width:600px){
    .summary-box{
        width:90%;
        padding:20px;
    }

    /* Stack buttons on small screens */
    .button-group{
        flex-direction:column;
    }
}
.msg{color:#b31217;font-size:13px;min-height:18px;margin-top:6px}.msg.ok{color:#1a7f37}.details{text-align:left;margin:0 0 18px;font-size:15px;line-height:1.7}
.remove{background:none;border:0;color:#b31217;cursor:pointer;font-size:16px;font-weight:bold}
.btn{border:0;cursor:pointer;font-family:inherit}.btn:disabled{opacity:.6;cursor:default}
.btn.alt{background:#555}.total-label{background:#ff4d4d;color:white}
[hidden]{display:none!important}
</style>
</head>

<body data-page="summary" data-requires-login>
<div class="summary-box">
<h1>Order Summary</h1>
<div class="details">
<div><strong>Name:</strong> <span id="d-name"></span></div>
<div><strong>Address:</strong> <span id="d-address"></span></div>
<div><strong>Phone:</strong> <span id="d-phone"></span></div>
<div><strong>Payment:</strong> <span id="d-payment"></span></div>
<div><strong>Estimated Delivery Time:</strong> 30–45 minutes</div>
</div>
<table>
<thead><tr><th>Dish</th><th>Qty</th><th>Price (₱)</th><th>Total (₱)</th><th><span class="sr" style="position:absolute;left:-9999px">Remove</span></th></tr></thead>
<tbody id="rows"></tbody>
<tfoot><tr><th colspan="3">Grand Total</th><th id="total"></th><th></th></tr></tfoot>
</table>
<div class="button-group">
<a href="checkout.html" class="btn alt">Back</a>
<button type="button" class="btn" id="confirm">Confirm Order</button>
</div>
<p class="msg" id="msg" role="status" aria-live="polite"></p>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="supabase-config.js"></script>
<script src="app.js"></script>
</body>
</html>
