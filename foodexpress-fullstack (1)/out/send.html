<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Message Sent - FoodExpress</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}
html{
    scroll-behavior:smooth;
}

/* Dark red gradient background */
body{
    min-height:100vh;
    background: linear-gradient(135deg,#b31217,#e52d27);
    display:flex;
    flex-direction:column;
}

/* Main wrapper to center content */
main{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

/* Message Container */
.message-container{
    max-width:600px;
    background:white;
    padding:40px;
    border-radius:12px;
    box-shadow:0 10px 20px rgba(0,0,0,0.2);
    text-align:center;
}

.message-container h2{
    color:#b31217;
    margin-bottom:20px;
    border-bottom:3px solid #b31217;
    display:inline-block;
    padding-bottom:5px;
}

/* Button */
button{
    margin-top:20px;
    padding:12px 25px;
    background: linear-gradient(45deg,#ff4d4d,#ff1a1a);
    color:white;
    border:none;
    font-size:16px;
    border-radius:5px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.05);
}

/* Footer */
footer{
    background:#333;
    color:white;
    text-align:center;
    padding:15px;
}

</style>
</head>

<body>

<main>
<div class="message-container">
    <h2>Message Sent!</h2>
    <p>Thank you for contacting FoodExpress. We have received your message and will get back to you shortly.</p>
    <button onclick="window.location.href='index.html'">Return to Home</button>
</div>
</main>

<footer>
<p>&copy; 2026 FoodExpress | All Rights Reserved</p>
</footer>

</body>
</html>
