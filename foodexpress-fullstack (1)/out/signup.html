<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - FoodExpress</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

/* Same background as login */
body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:linear-gradient(135deg, #b31217, #e52d27);
}

/* Glass effect box */
.form-box{
    background:rgba(255,255,255,0.95);
    padding:35px;
    border-radius:20px;
    width:340px;
    text-align:center;
    box-shadow:0 15px 40px rgba(0,0,0,0.4);
    backdrop-filter: blur(10px);
}

/* Logo */
.logo{
    width:130px;
    height:130px;
    object-fit:cover;
    border-radius:50%;
    margin-bottom:15px;
    box-shadow:0 8px 20px rgba(0,0,0,0.3);
}

/* Brand Title */
.brand-title{
    font-size:22px;
    font-weight:bold;
    color:#b31217;
    margin-bottom:5px;
}

.brand-subtitle{
    font-size:13px;
    color:#666;
    margin-bottom:20px;
}

/* Inputs */
input{
    width:100%;
    padding:12px;
    margin:12px 0;
    border-radius:8px;
    border:1px solid #ddd;
    font-size:14px;
}

/* Button */
button{
    width:100%;
    padding:12px;
    background:linear-gradient(45deg,#ff4d4d,#ff1a1a);
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
    font-size:15px;
    transition:0.3s;
}

button:hover{
    transform:scale(1.05);
}

/* Link */
a{
    display:block;
    margin-top:15px;
    text-decoration:none;
    color:#b31217;
    font-weight:bold;
}
.msg{color:#b31217;font-size:13px;min-height:18px;margin-top:6px}.msg.ok{color:#1a7f37}
[hidden]{display:none!important}
</style>

</head>
<body data-page="signup">
<div class="form-box">
<img src="logo.webp" alt="FoodExpress Logo" class="logo">
<div class="brand-title">FoodExpress</div>
<div class="brand-subtitle">Create Your Account</div>
<h2>Register</h2>
<form id="form">
<input type="text" name="fullname" placeholder="Full Name" autocomplete="name" required>
<input type="email" name="email" placeholder="Email" autocomplete="email" required>
<input type="password" name="password" placeholder="Password (6+ characters)" autocomplete="new-password" minlength="6" required>
<input type="password" name="confirm" placeholder="Confirm Password" autocomplete="new-password" required>
<button type="submit">Create Account</button>
<p class="msg" id="msg" role="status" aria-live="polite"></p>
</form>
<a href="login.html">Already have an account? Login</a>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="supabase-config.js"></script>
<script src="app.js"></script>
</body>
</html>
