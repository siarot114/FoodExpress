<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cancel Order - FoodExpress</title>

<style>
body{
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #b31217, #e52d27);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
}

/* MAIN BOX */
.box{
    background: white;
    padding: 30px;
    width: 420px;
    border-radius: 15px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

/* HEADER */
h2{
    color: #ff4d4d;
    margin-bottom: 10px;
}

/* FORM ELEMENTS */
select, textarea{
    width: 100%;
    padding: 10px;
    margin: 10px 0;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 14px;
}

textarea{
    height: 80px;
    resize: none;
}

button{
    background: #ff4d4d;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    transition: 0.3s;
    margin-top: 10px;
}

button:hover{
    background: #e60000;
}

/* FOOTER NOTE */
.note{
    color: red;
    font-size: 13px;
    margin-top: 10px;
}
.msg{color:#b31217;font-size:13px;min-height:18px;margin-top:6px}.msg.ok{color:#1a7f37}
[hidden]{display:none!important}
</style>
</head>
<body data-page="cancel" data-requires-login>
<div class="box">
<h2>Cancel Order</h2>
<p>Please tell us why you are canceling:</p>
<form id="form">
<select name="reason">
<option>Changed my mind</option>
<option>Wrong order</option>
<option>Delivery is too slow</option>
<option>Found cheaper option</option>
<option>Other</option>
</select>
<textarea name="comments" placeholder="Additional comments (optional)" maxlength="300"></textarea>
<button type="submit">Submit Cancellation</button>
</form>
<p class="msg" id="msg" role="status" aria-live="polite"></p>
<p class="note">Note: Once canceled, this order cannot be restored.</p>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="supabase-config.js"></script>
<script src="app.js"></script>
</body>
</html>
